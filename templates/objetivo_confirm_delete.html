{% extends 'base.html' %}

{% block title %}Eliminar Objetivo{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card bg-glass border-danger shadow-lg p-4">
            <span style="font-size: 4rem; margin-bottom: 10px;">⚠️</span>
            <h3 class="fw-bold text-light mb-3">¿Estás seguro?</h3>
            <p class="text-muted fs-5">Vas a eliminar el objetivo <strong>"{{ object.name }}"</strong> y su archivo GPX.</p>
            <p class="text-danger small mb-4">Esta acción no se puede deshacer.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'objetivos' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                    <button type="submit" class="btn btn-danger fw-bold rounded-pill shadow px-4">Sí, Eliminar Objetivo</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
