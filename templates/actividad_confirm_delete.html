{% extends 'base.html' %}
{% block title %}Eliminar Actividad{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card bg-glass border-danger shadow-lg p-5">
            <h2 class="text-danger fw-bold mb-3">⚠️ ¿Eliminar Entrenamiento?</h2>
            <p class="text-light">Estás a punto de borrar la sesión de tu base de datos local. Esta acción no se puede deshacer.</p>
            <form method="post" class="mt-4">
                {% csrf_token %}
                <a href="{% url 'actividades' %}" class="btn btn-secondary px-4 me-2">Cancelar</a>
                <button type="submit" class="btn btn-danger px-4">Sí, Eliminar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
